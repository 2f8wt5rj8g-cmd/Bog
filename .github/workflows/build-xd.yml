name: Build XDTweak
on:
  push:
    paths:
      - 'xd_tweak/**'
      - '.github/workflows/build-xd.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $(whoami) /opt/theos

      - name: Build deb
        env:
          THEOS: /opt/theos
        run: |
          cd xd_tweak
          make package

      - name: List output
        run: ls -la xd_tweak/packages/ 2>/dev/null || echo 'no packages dir'

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: xd-vipcrack-deb
          path: xd_tweak/packages/*.deb
