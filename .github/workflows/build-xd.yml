name: Build XDTweak
on:
  push:
    paths:
      - 'xd_tweak/**'
      - '.github/workflows/build-xd.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $(whoami) /opt/theos

      - name: Build deb
        env:
          THEOS: /opt/theos
        run: |
          cd xd_tweak
          make package

      - name: Copy deb to output
        run: |
          mkdir -p output
          cp xd_tweak/packages/*.deb output/XDVipCrack.deb
          ls -la output/

      - name: Push deb back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/XDVipCrack.deb
          git diff --staged --quiet || git commit -m "Add built XDVipCrack.deb"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.gif HEAD:main
