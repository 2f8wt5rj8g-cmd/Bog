name: Build XDTweak
on:
  push:
    paths:
      - 'xd_tweak/**'
      - '.github/workflows/build-xd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $(whoami) /opt/theos

      - name: Build deb with Theos
        env:
          THEOS: /opt/theos
        run: |
          cd xd_tweak
          make package

      - name: Copy dylib and CydiaSubstrate
        run: |
          mkdir -p output
          cp xd_tweak/packages/*.deb output/XDVipCrack.deb
          # 找到编译好的 dylib
          find xd_tweak -name '*.dylib' -exec cp {} output/XDVipCrack.dylib \;
          # 复制 CydiaSubstrate
          cp /opt/theos/lib/CydiaSubstrate.framework/CydiaSubstrate output/CydiaSubstrate.dylib
          ls -la output/

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Add built dylib + CydiaSubstrate"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
