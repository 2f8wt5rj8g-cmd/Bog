name: Build XDTweak
on:
  push:
    paths:
      - 'xd_tweak/**'
      - '.github/workflows/build-xd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile
        run: |
          set -e
          cd xd_tweak
          SDKPATH="/Applications/Xcode_15.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          ls -la "$SDKPATH"
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDKPATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/XDVipCrack.dylib \
            -o XDVipCrack.dylib Tweak.mm
          otool -L XDVipCrack.dylib

      - name: Push
        run: |
          set -e
          mkdir -p output
          cp xd_tweak/XDVipCrack.dylib output/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Add substrate-free dylib"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
